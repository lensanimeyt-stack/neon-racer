<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Racer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .score-board { font-size: 36px; font-weight: bold; margin: 15px 0; color: #facc15; }
        .game-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
            margin-top: 20px;
        }
        .game-btn:active { transform: scale(0.95); }
        p { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏎️ Neon Racer</h1>
        <p>Drive fast, dodge traffic, and collect points!</p>
        
        <div class="score-board" id="score">Score: 0</div>
        
        <button class="game-btn" onclick="accelerateCar()">🚀 Accelerate!</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;

        function accelerateCar() {
            score += 10;
            document.getElementById('score').innerText = 'Score: ' + score;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
